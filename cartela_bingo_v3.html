<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo da Amile e Paulo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background-color: rgba(247, 238, 223, 1);
      background-image: url('https://github.com/rst369/cartela-bingo/blob/main/Convite%20de%20pr%C3%A9-festa%20de%20casamento%20(4).png?raw=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .bingo-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 250, 242, 0.88);
      backdrop-filter: blur(2px);
      border-radius: 42px;
      padding: 30px 28px 36px;
      box-shadow: 0 20px 45px -12px rgba(120, 90, 60, 0.35),
                  0 0 0 1px rgba(200, 170, 140, 0.25);
      border: 2px solid #e8d5b5;
      opacity: 0.925;
    }

    .bingo-types {
      background: rgba(255, 250, 242, 0.9);
      border-radius: 28px;
      padding: 16px 22px;
      margin-bottom: 20px;
      border: 2px solid #dcc9a8;
      box-shadow: inset 0 3px 10px rgba(160, 120, 80, 0.08),
                  0 4px 0 #e8d5b5;
    }

    .bingo-types-title {
      color: #6b4f30;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .bingo-types-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .bingo-type-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fdf6e9;
      border: 2px solid #dcc9a8;
      border-radius: 50px;
      padding: 8px 18px 8px 12px;
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
      box-shadow: 0 3px 0 #e8d5b5;
      font-weight: 600;
      color: #6b4f30;
      font-size: 0.9rem;
    }

    .bingo-type-item:hover {
      background: #f5e8d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #e8d5b5;
    }

    .bingo-type-item:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #e8d5b5;
    }

    .bingo-type-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #c9a87c;
      border-radius: 6px;
      background: #fffaf2;
      cursor: pointer;
      position: relative;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .bingo-type-item input[type="checkbox"]:checked {
      background: #b08d5c;
      border-color: #8a6b42;
    }

    .bingo-type-item input[type="checkbox"]:checked::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fffaf2;
      font-size: 0.85rem;
      font-weight: 900;
      line-height: 1;
    }

    .bingo-type-item:has(input:checked) {
      background: #f0e0c8;
      border-color: #c9a87c;
    }

    .space-area {
      background: rgba(255, 250, 242, 0.9);
      border-radius: 28px;
      padding: 18px 22px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #dcc9a8;
      box-shadow: inset 0 3px 10px rgba(160, 120, 80, 0.08),
                  0 4px 0 #e8d5b5;
      transition: all 0.2s;
    }

    .space-label {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #6b4f30;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 1rem;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .space-label span {
      background: #c9a87c;
      color: #fffaf2;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 1.15rem;
      font-weight: 800;
      box-shadow: 0 3px 0 #a0845e;
    }

    .space-input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .space-input-area input {
      background: rgba(253, 246, 233, 0.95);
      border: 2px solid #dcc9a8;
      border-radius: 60px;
      padding: 11px 22px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #5a3e25;
      width: 150px;
      text-align: center;
      outline: none;
      transition: 0.2s;
      box-shadow: inset 0 2px 5px rgba(160, 120, 80, 0.1);
      letter-spacing: 1px;
    }

    .space-input-area input::placeholder {
      color: #b8a184;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .space-input-area input:focus {
      border-color: #b08d5c;
      box-shadow: 0 0 0 4px rgba(176, 141, 92, 0.15),
                  inset 0 2px 5px rgba(160, 120, 80, 0.1);
    }

    .space-input-area button {
      background: #b08d5c;
      border: none;
      border-radius: 60px;
      padding: 11px 26px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fffaf2;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 0 #8a6b42;
      letter-spacing: 0.4px;
    }

    .space-input-area button:hover {
      background: #c19d6b;
      transform: translateY(-1px);
      box-shadow: 0 5px 0 #8a6b42;
    }

    .space-input-area button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8a6b42;
    }

    .space-input-area button.btn-clear {
      background: #c4a882;
      box-shadow: 0 4px 0 #a0845e;
    }

    .space-input-area button.btn-clear:hover {
      background: #d4b892;
    }

    .space-numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: 10px;
      align-items: center;
      flex: 1;
      min-width: 140px;
    }

    .space-badge {
      background: #e8d5b5;
      color: #5a3e25;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 5px 16px;
      border-radius: 40px;
      box-shadow: 0 2px 0 #c9a87c;
      border: 1px solid #d4b892;
      transition: 0.15s;
      letter-spacing: 0.4px;
    }

    .space-badge.highlight {
      background: #c9a87c;
      color: #fffaf2;
      border-color: #b08d5c;
      box-shadow: 0 0 14px rgba(176, 141, 92, 0.6), 0 2px 0 #a0845e;
      transform: scale(1.04);
    }

    .bingo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 6px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .bingo-header h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #6b4f30;
      text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(160, 120, 80, 0.2);
      letter-spacing: 3px;
      word-break: keep-all;
    }

    .bingo-header h1 span {
      color: #b08d5c;
      text-shadow: 0 2px 0 #fff, 0 0 16px rgba(176, 141, 92, 0.35);
    }

    .reset-btn {
      background: #e8d5b5;
      border: 2px solid #d4b892;
      border-radius: 50px;
      padding: 9px 22px;
      font-weight: 700;
      color: #6b4f30;
      cursor: pointer;
      box-shadow: 0 4px 0 #c9a87c;
      transition: 0.1s;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .reset-btn:hover {
      background: #f0e0c8;
      transform: translateY(-1px);
      box-shadow: 0 5px 0 #c9a87c;
    }

    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c9a87c;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .bingo-cell {
      aspect-ratio: 1 / 0.85;
      background: rgba(255, 250, 242, 0.92);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      font-weight: 800;
      color: #5a3e25;
      box-shadow: 0 6px 0 #e0cfb4, 0 6px 14px rgba(160, 120, 80, 0.18);
      border: 2px solid #e0cfb4;
      transition: 0.1s ease;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .bingo-cell.free {
      background: rgba(240, 224, 200, 0.95);
      border-color: #d4b892;
      color: #8a6b42;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(176, 141, 92, 0.25), 0 6px 0 #d4b892;
    }

    .bingo-cell.marked {
      background: #c9a87c;
      color: #fffaf2;
      border-color: #b08d5c;
      box-shadow: 0 0 22px rgba(176, 141, 92, 0.55), 0 4px 0 #a0845e;
      transform: scale(0.98);
      text-shadow: 0 1px 3px rgba(90, 62, 37, 0.4);
      font-weight: 900;
    }

    .bingo-cell.marked::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 10px;
      font-size: 1rem;
      color: #fffaf2;
      opacity: 0.95;
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(90, 62, 37, 0.5);
    }

    .bingo-cell:active:not(.free) {
      transform: scale(0.95);
      box-shadow: 0 3px 0 #e0cfb4;
    }

    .bingo-cell.highlight {
      border-color: #b08d5c;
      box-shadow: 0 0 0 3px rgba(176, 141, 92, 0.4), 0 6px 0 #e0cfb4;
    }

    .bingo-letter-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .bingo-letter {
      text-align: center;
      font-weight: 900;
      font-size: 1.8rem;
      color: #c9a87c;
      text-shadow: 0 2px 0 #fff, 0 2px 5px rgba(160, 120, 80, 0.2);
      letter-spacing: 4px;
    }

    .footer-note {
      text-align: center;
      color: #8a6b42;
      margin-top: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      opacity: 0.85;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .bingo-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(60, 40, 20, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }

    .bingo-popup-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bingo-popup {
      background: linear-gradient(145deg, #fffaf2, #f5e8d3);
      border-radius: 32px;
      padding: 40px 48px 32px;
      text-align: center;
      box-shadow: 0 30px 60px -10px rgba(60, 40, 20, 0.5),
                  0 0 0 3px #c9a87c,
                  0 0 0 8px rgba(255, 250, 242, 0.4);
      max-width: 480px;
      width: 100%;
      animation: popIn 0.4s ease;
      border: 2px solid #e8d5b5;
    }

    .bingo-popup-icon {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 10px;
      animation: bounce 0.8s ease infinite alternate;
      filter: drop-shadow(0 4px 8px rgba(160, 120, 80, 0.3));
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .bingo-popup h2 {
      font-size: 3rem;
      font-weight: 900;
      color: #b08d5c;
      letter-spacing: 4px;
      text-shadow: 0 3px 0 #fff, 0 5px 12px rgba(160, 120, 80, 0.35);
      margin-bottom: 8px;
    }

    .bingo-popup p {
      color: #6b4f30;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .bingo-popup-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bingo-popup-actions button {
      border: none;
      border-radius: 60px;
      padding: 14px 32px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.5px;
      font-family: inherit;
    }

    .bingo-popup-actions .btn-new-card {
      background: #b08d5c;
      color: #fffaf2;
      box-shadow: 0 5px 0 #8a6b42;
    }

    .bingo-popup-actions .btn-new-card:hover {
      background: #c19d6b;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #8a6b42;
    }

    .bingo-popup-actions .btn-new-card:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8a6b42;
    }

    .bingo-popup-actions .btn-close {
      background: #e8d5b5;
      color: #6b4f30;
      box-shadow: 0 5px 0 #c9a87c;
      border: 2px solid #d4b892;
    }

    .bingo-popup-actions .btn-close:hover {
      background: #f0e0c8;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #c9a87c;
    }

    .bingo-popup-actions .btn-close:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c9a87c;
    }

    .bingo-active-banner {
      display: none;
      background: linear-gradient(90deg, #b08d5c, #c9a87c, #b08d5c);
      color: #fffaf2;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 6px 0 #8a6b42, 0 8px 20px rgba(160, 120, 80, 0.35);
      cursor: pointer;
      transition: 0.15s;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .bingo-active-banner.active {
      display: block;
    }

    .bingo-active-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #8a6b42, 0 10px 24px rgba(160, 120, 80, 0.45);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 0 #8a6b42, 0 8px 20px rgba(160, 120, 80, 0.35); }
      50% { box-shadow: 0 6px 0 #8a6b42, 0 8px 32px rgba(176, 141, 92, 0.65); }
    }

    @media (max-width: 700px) {
      .bingo-container {
        padding: 18px 12px 24px;
      }
      .bingo-grid {
        gap: 8px;
      }
      .bingo-cell {
        font-size: 1.2rem;
        border-radius: 14px;
      }
      .bingo-cell.free {
        font-size: 0.7rem;
      }
      .bingo-letter {
        font-size: 1.2rem;
      }
      .bingo-header h1 {
        font-size: 1.3rem;
        letter-spacing: 2px;
      }
      .space-area {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .space-input-area input {
        width: 110px;
        padding: 8px 14px;
        font-size: 1rem;
      }
      .space-input-area button {
        padding: 8px 18px;
        font-size: 0.85rem;
      }
      .space-badge {
        font-size: 0.85rem;
        padding: 4px 12px;
      }
      .bingo-type-item {
        font-size: 0.8rem;
        padding: 6px 14px 6px 10px;
      }
      .bingo-popup {
        padding: 30px 24px 24px;
      }
      .bingo-popup h2 {
        font-size: 2.2rem;
      }
      .bingo-popup-actions button {
        padding: 12px 22px;
        font-size: 0.9rem;
      }
      .bingo-active-banner {
        font-size: 0.85rem;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
<div class="bingo-container">

  <div class="bingo-active-banner" id="bingoActiveBanner" title="Clique para ver o popup novamente">
    🎉 BINGO! (clique para ver)
  </div>

  <div class="bingo-types">
    <div class="bingo-types-title">🎯 Tipos de Bingo (marque para ativar a verificação)</div>
    <div class="bingo-types-list">
      <label class="bingo-type-item">
        <input type="checkbox" id="typeLinha" data-type="linha">
        Linha
      </label>
      <label class="bingo-type-item">
        <input type="checkbox" id="typeColuna" data-type="coluna">
        Coluna
      </label>
      <label class="bingo-type-item">
        <input type="checkbox" id="typeLinhaColuna" data-type="linhaColuna">
        Linha ou Coluna
      </label>
      <label class="bingo-type-item">
        <input type="checkbox" id="typeDiagonal" data-type="diagonal">
        Diagonal
      </label>
      <label class="bingo-type-item">
        <input type="checkbox" id="typeCartelaCheia" data-type="cartelaCheia">
        Cartela Cheia
      </label>
    </div>
  </div>

  <div class="space-area">
    <div class="space-label">
      📢 ESPAÇO
      <span id="spaceCounter">0</span>
    </div>
    <div class="space-input-area">
      <input type="number" id="numberInput" placeholder="Nº (1-75)" min="1" max="75" step="1">
      <button id="addNumberBtn">+ Adicionar</button>
      <button id="clearSpaceBtn" class="btn-clear">Limpar</button>
    </div>
    <div class="space-numbers" id="spaceNumbersContainer"></div>
  </div>

  <div class="bingo-header">
    <h1>B<span>I</span>N<span>G</span>O</h1>
    <button class="reset-btn" id="resetCartelaBtn">↻ Nova cartela</button>
  </div>

  <div class="bingo-letter-row">
    <div class="bingo-letter">B</div>
    <div class="bingo-letter">I</div>
    <div class="bingo-letter">N</div>
    <div class="bingo-letter">G</div>
    <div class="bingo-letter">O</div>
  </div>

  <div class="bingo-grid" id="bingoGrid"></div>

  <div class="footer-note">
    ⚡ Bingo da Amile e Paulo • clique nas células para marcar
  </div>
</div>

<div class="bingo-popup-overlay" id="bingoPopupOverlay">
  <div class="bingo-popup">
    <div class="bingo-popup-icon">🎉</div>
    <h2>BINGO!</h2>
    <p id="bingoPopupMessage">Você completou o bingo!</p>
    <div class="bingo-popup-actions">
      <button class="btn-new-card" id="popupNewCardBtn">🎲 Gerar outra cartela</button>
      <button class="btn-close" id="popupCloseBtn">Fechar</button>
    </div>
  </div>
</div>

<script>
  (function() {
    function generateUniqueNumbers(min, max, count = 5) {
      const numbers = new Set();
      while (numbers.size < count) {
        const num = Math.floor(Math.random() * (max - min + 1)) + min;
        numbers.add(num);
      }
      return Array.from(numbers);
    }

    function generateBingoCard() {
      return {
        B: generateUniqueNumbers(1, 15),
        I: generateUniqueNumbers(16, 30),
        N: generateUniqueNumbers(31, 45),
        G: generateUniqueNumbers(46, 60),
        O: generateUniqueNumbers(61, 75)
      };
    }

    let currentCard = generateBingoCard();
    let markedState = Array(5).fill().map(() => Array(5).fill(false));
    markedState[2][2] = true;

    const bingoGrid = document.getElementById('bingoGrid');
    const resetCartelaBtn = document.getElementById('resetCartelaBtn');
    const numberInput = document.getElementById('numberInput');
    const addNumberBtn = document.getElementById('addNumberBtn');
    const clearSpaceBtn = document.getElementById('clearSpaceBtn');
    const spaceNumbersContainer = document.getElementById('spaceNumbersContainer');
    const spaceCounter = document.getElementById('spaceCounter');

    const popupOverlay = document.getElementById('bingoPopupOverlay');
    const popupNewCardBtn = document.getElementById('popupNewCardBtn');
    const popupCloseBtn = document.getElementById('popupCloseBtn');
    const popupMessage = document.getElementById('bingoPopupMessage');
    const bingoActiveBanner = document.getElementById('bingoActiveBanner');

    const typeCheckboxes = {
      linha: document.getElementById('typeLinha'),
      coluna: document.getElementById('typeColuna'),
      linhaColuna: document.getElementById('typeLinhaColuna'),
      diagonal: document.getElementById('typeDiagonal'),
      cartelaCheia: document.getElementById('typeCartelaCheia')
    };

    let spaceNumbers = [];

    // ============================================================
    // RASTREAMENTO DE BINGOS JÁ NOTIFICADOS
    // Cada "bingo" é identificado por uma chave única:
    //   "linha-0"      → linha 0 completa
    //   "coluna-2"     → coluna 2 completa
    //   "diag-princ"   → diagonal principal
    //   "diag-sec"     → diagonal secundária
    //   "cartela-cheia"→ cartela toda completa
    //   "linhaColuna"  → tipo "Linha ou Coluna" (só notifica 1x por sessão)
    // ============================================================
    let bingosNotificados = new Set();

    // ==================== ESPAÇO ====================
    function renderSpaceNumbers() {
      spaceNumbersContainer.innerHTML = '';
      if (spaceNumbers.length === 0) {
        const emptyMsg = document.createElement('span');
        emptyMsg.style.color = '#b8a184';
        emptyMsg.style.fontSize = '0.9rem';
        emptyMsg.style.fontStyle = 'italic';
        emptyMsg.textContent = 'nenhum número';
        spaceNumbersContainer.appendChild(emptyMsg);
      } else {
        spaceNumbers.forEach(num => {
          const badge = document.createElement('span');
          badge.className = 'space-badge';
          badge.textContent = num;
          spaceNumbersContainer.appendChild(badge);
        });
      }
      spaceCounter.textContent = spaceNumbers.length;
    }

    function addNumberToSpace(number) {
      if (isNaN(number) || number < 1 || number > 75) {
        alert('Por favor, insira um número entre 1 e 75.');
        return false;
      }
      const num = Number(number);
      if (spaceNumbers.includes(num)) {
        alert(`O número ${num} já foi adicionado ao espaço.`);
        return false;
      }
      spaceNumbers.push(num);
      renderSpaceNumbers();
      highlightNumberInCard(num);
      return true;
    }

    function clearSpace() {
      spaceNumbers = [];
      renderSpaceNumbers();
      removeAllHighlights();
    }

    function removeAllHighlights() {
      document.querySelectorAll('.bingo-cell').forEach(cell => {
        cell.classList.remove('highlight');
      });
    }

    function highlightNumberInCard(number) {
      removeAllHighlights();
      const cells = document.querySelectorAll('.bingo-cell');
      cells.forEach(cell => {
        if (cell.dataset.free === 'true') return;
        const cellValue = Number(cell.dataset.value);
        if (cellValue === number) {
          cell.classList.add('highlight');
        }
      });
    }

    // ==================== CARTELA ====================
    function renderCard() {
      bingoGrid.innerHTML = '';
      const columns = ['B', 'I', 'N', 'G', 'O'];

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const cell = document.createElement('div');
          cell.className = 'bingo-cell';

          if (row === 2 && col === 2) {
            cell.classList.add('free');
            cell.textContent = 'FREE';
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.dataset.free = 'true';
            bingoGrid.appendChild(cell);
            continue;
          }

          const columnLetter = columns[col];
          const columnNumbers = currentCard[columnLetter];
          const numberValue = columnNumbers[row];

          cell.textContent = numberValue;
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.dataset.value = numberValue;
          cell.dataset.free = 'false';

          if (markedState[row][col]) {
            cell.classList.add('marked');
          }

          cell.addEventListener('click', () => toggleMark(row, col, cell));
          bingoGrid.appendChild(cell);
        }
      }
    }

    function toggleMark(row, col, cellElement) {
      if (row === 2 && col === 2) return;
      markedState[row][col] = !markedState[row][col];
      if (markedState[row][col]) {
        cellElement.classList.add('marked');
      } else {
        cellElement.classList.remove('marked');
      }
      verificarBingo();
    }

    // ==================== VERIFICAÇÃO ====================
    function isLinhaCompleta(row) {
      for (let col = 0; col < 5; col++) {
        if (!markedState[row][col]) return false;
      }
      return true;
    }

    function isColunaCompleta(col) {
      for (let row = 0; row < 5; row++) {
        if (!markedState[row][col]) return false;
      }
      return true;
    }

    function isDiagonalPrincipalCompleta() {
      for (let i = 0; i < 5; i++) {
        if (!markedState[i][i]) return false;
      }
      return true;
    }

    function isDiagonalSecundariaCompleta() {
      for (let i = 0; i < 5; i++) {
        if (!markedState[i][4 - i]) return false;
      }
      return true;
    }

    function isCartelaCheia() {
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          if (!markedState[row][col]) return false;
        }
      }
      return true;
    }

    // Retorna um objeto:
    //   { chavesAtivas: Set com as chaves de todos os bingos válidos agora,
    //     descricoes:   Set com os textos legíveis (para exibição) }
    function getBingosAtivos() {
      const chavesAtivas = new Set();
      const descricoes = new Set();

      // Linha (cada linha específica é um bingo separado)
      if (typeCheckboxes.linha.checked) {
        for (let row = 0; row < 5; row++) {
          if (isLinhaCompleta(row)) {
            chavesAtivas.add(`linha-${row}`);
            descricoes.add(`Linha ${row + 1}`);
          }
        }
      }

      // Coluna
      if (typeCheckboxes.coluna.checked) {
        for (let col = 0; col < 5; col++) {
          if (isColunaCompleta(col)) {
            chavesAtivas.add(`coluna-${col}`);
            descricoes.add(`Coluna ${col + 1}`);
          }
        }
      }

      // Linha ou Coluna (só uma "chave" geral, para não poluir)
      if (typeCheckboxes.linhaColuna.checked) {
        let temLinha = false;
        let temColuna = false;
        let detalhe = [];
        for (let row = 0; row < 5; row++) {
          if (isLinhaCompleta(row)) { temLinha = true; detalhe.push(`L${row+1}`); }
        }
        for (let col = 0; col < 5; col++) {
          if (isColunaCompleta(col)) { temColuna = true; detalhe.push(`C${col+1}`); }
        }
        if (temLinha || temColuna) {
          // Usa uma chave única mas com detalhe das linhas/colunas
          const chave = `linhaColuna-${detalhe.join('_')}`;
          chavesAtivas.add(chave);
          descricoes.add(`Linha ou Coluna (${detalhe.join(', ')})`);
        }
      }

      // Diagonal
      if (typeCheckboxes.diagonal.checked) {
        if (isDiagonalPrincipalCompleta()) {
          chavesAtivas.add('diag-princ');
          descricoes.add('Diagonal Principal');
        }
        if (isDiagonalSecundariaCompleta()) {
          chavesAtivas.add('diag-sec');
          descricoes.add('Diagonal Secundária');
        }
      }

      // Cartela Cheia
      if (typeCheckboxes.cartelaCheia.checked) {
        if (isCartelaCheia()) {
          chavesAtivas.add('cartela-cheia');
          descricoes.add('Cartela Cheia');
        }
      }

      return { chavesAtivas, descricoes };
    }

    function atualizarBannerAtivo(temVencedores) {
      if (temVencedores) {
        bingoActiveBanner.classList.add('active');
      } else {
        bingoActiveBanner.classList.remove('active');
      }
    }

    function abrirPopupBingo(descricoes) {
      const lista = Array.from(descricoes).join(', ');
      popupMessage.textContent = `Você completou: ${lista}!`;
      popupOverlay.classList.add('active');
    }

    function verificarBingo() {
      const { chavesAtivas, descricoes } = getBingosAtivos();

      // Remove do set de notificados as chaves que deixaram de ser válidas
      for (const chave of Array.from(bingosNotificados)) {
        if (!chavesAtivas.has(chave)) {
          bingosNotificados.delete(chave);
        }
      }

      // Descobre quais chaves ativas ainda NÃO foram notificadas
      const novasChaves = [];
      for (const chave of chavesAtivas) {
        if (!bingosNotificados.has(chave)) {
          novasChaves.push(chave);
        }
      }

      atualizarBannerAtivo(chavesAtivas.size > 0);

      if (novasChaves.length > 0) {
        // Marca todas as chaves ativas como notificadas
        for (const chave of chavesAtivas) {
          bingosNotificados.add(chave);
        }
        abrirPopupBingo(descricoes);
      }

      if (chavesAtivas.size === 0 && popupOverlay.classList.contains('active')) {
        fecharPopup();
      }
    }

    function resetCard() {
      currentCard = generateBingoCard();
      markedState = Array(5).fill().map(() => Array(5).fill(false));
      markedState[2][2] = true;
      bingosNotificados = new Set();
      removeAllHighlights();
      renderCard();
      atualizarBannerAtivo(false);
      fecharPopup();
    }

    function fecharPopup() {
      popupOverlay.classList.remove('active');
    }

    function novaCartelaPeloPopup() {
      fecharPopup();
      resetCard();
    }

    popupCloseBtn.addEventListener('click', fecharPopup);
    popupNewCardBtn.addEventListener('click', novaCartelaPeloPopup);

    popupOverlay.addEventListener('click', (e) => {
      if (e.target === popupOverlay) fecharPopup();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && popupOverlay.classList.contains('active')) {
        fecharPopup();
      }
    });

    bingoActiveBanner.addEventListener('click', () => {
      const { descricoes } = getBingosAtivos();
      if (descricoes.size > 0) {
        abrirPopupBingo(descricoes);
      }
    });

    addNumberBtn.addEventListener('click', () => {
      const rawValue = numberInput.value.trim();
      if (rawValue === '') {
        alert('Digite um número.');
        return;
      }
      const number = Number(rawValue);
      const added = addNumberToSpace(number);
      if (added) {
        numberInput.value = '';
        numberInput.focus();
      }
    });

    numberInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addNumberBtn.click();
      }
    });

    clearSpaceBtn.addEventListener('click', () => {
      clearSpace();
      numberInput.focus();
    });

    resetCartelaBtn.addEventListener('click', resetCard);

    Object.values(typeCheckboxes).forEach(cb => {
      cb.addEventListener('change', verificarBingo);
    });

    function init() {
      renderCard();
      renderSpaceNumbers();
      atualizarBannerAtivo(false);
    }

    init();
  })();
</script>
</body>
</html>
